<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <script>try{var th=localStorage.getItem("corelog.theme");if(th==="dark"||th==="light")document.documentElement.dataset.theme=th;}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CoreLog — Karot Loglama Sistemi</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sol gezinme rayı -->
    <nav class="rail" id="rail" aria-label="Ana menü">
      <div class="rail-brand" title="CoreLog">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <rect x="9" y="2" width="14" height="28" rx="3" fill="#0ea5e9"/>
          <rect x="9" y="10" width="14" height="6" fill="#f59e0b"/>
          <rect x="9" y="20" width="14" height="5" fill="#22c55e"/>
          <line x1="16" y1="2" x2="16" y2="30" stroke="#0f172a" stroke-width="1" opacity=".3"/>
        </svg>
        <span class="rail-brand-text">CoreLog</span>
      </div>
      <button class="rail-btn" data-route="dashboard" title="Panel">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/></svg><span data-tr="Panel">Panel</span>
      </button>
      <button class="rail-btn" data-route="holes" title="Kuyular">
        <svg viewBox="0 0 24 24"><path d="M6 2h12v2H6zm2 3h8v17l-4-3-4 3z"/></svg><span data-tr="Kuyular">Kuyular</span>
      </button>
      <button class="rail-btn" data-route="log" title="Loglama" id="railLog">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 4h12v2H3zm0 4h18v2H3zm0 4h12v2H3z"/></svg><span data-tr="Loglama">Loglama</span>
      </button>
      <button class="rail-btn" data-route="qaqc" title="QAQC">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5zm-1 14-4-4 1.4-1.4L11 13.2l5.6-5.6L18 9z"/></svg><span data-tr="QAQC">QAQC</span>
      </button>
      <button class="rail-btn" data-route="library" title="Kod Kütüphanesi">
        <svg viewBox="0 0 24 24"><path d="M4 4h6v16H4zm8 0h8v6h-8zm0 8h8v8h-8z"/></svg><span data-tr="Kodlar">Kodlar</span>
      </button>
      <button class="rail-btn" data-route="settings" title="Ayarlar / Dışa aktar">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3H9l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L9 21h6l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg><span data-tr="Ayarlar">Ayarlar</span>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="btnGuideToggle" title="Rehber (yardım paneli)">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.4-2.1 1.2-2.8l1.2-1.2a1.9 1.9 0 0 0 .6-1.5 2 2 0 0 0-4 0H8a4 4 0 0 1 8 0c0 .9-.4 1.7-.9 2.3z"/></svg><span data-tr="Rehber">Rehber</span>
      </button>
      <div class="rail-status" id="railStatus" title="Kayıt durumu">
        <span class="dot ok"></span><span class="rail-status-text" data-tr="Kaydedildi">Kaydedildi</span>
      </div>
    </nav>

    <!-- Ana içerik -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btnMenu" aria-label="Menü">
          <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-right">
          <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
            <input id="globalSearch" type="search" placeholder="Kuyu ara… (örn. FX-18)" data-tr-ph="Kuyu ara… (örn. FX-18)" />
          </div>
          <span class="online-badge" id="onlineBadge">Çevrimiçi</span>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>

    <!-- Sağ rehber paneli -->
    <aside class="guide" id="guide" aria-label="Rehber paneli">
      <div class="guide-head">
        <strong data-tr="Rehber">Rehber</strong>
        <button class="btn sm ghost" id="btnGuideAll" title="Tüm açıklamaları tek sayfada gör" data-tr="Tam kılavuz">Tam kılavuz</button>
        <button class="icon-btn" id="btnGuideClose" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
      </div>
      <div class="guide-body" id="guideBody"></div>
    </aside>
  </div>

  <div id="sheetRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="js/bundle.js?v=202609140612"></script>
</body>
</html>
