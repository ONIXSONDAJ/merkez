/* =========================================================
   CoreLog — Karot Loglama Sistemi
   Tablet öncelikli, masaüstü ve telefonda da çalışan arayüz
   ========================================================= */
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --primary: #0284c7;
  --primary-2: #0ea5e9;
  --primary-soft: #e0f2fe;
  --accent: #f59e0b;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --err: #dc2626;
  --err-soft: #fee2e2;
  --rail-bg: #0f172a;
  --rail-text: #cbd5e1;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
  --shadow-lg: 0 10px 40px rgba(15,23,42,.18);
  --touch: 46px;
  --rail-w: 84px;
  --guide-w: 360px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
:root { --note-bg: #fffbeb; --note-border: #fde68a; --note-text: #92400e; --note-title: #b45309; color-scheme: light; }
/* Karanlık tema: Ayarlar'dan seçilir ya da sistem tercihi */
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111a2b; --surface-2: #17213a; --border: #253150; --border-strong: #33415e;
  --text: #e5e9f2; --text-2: #b7c0d3; --text-3: #7d8aa5;
  --primary: #38bdf8; --primary-2: #7dd3fc; --primary-soft: #0c2a3d;
  --ok: #4ade80; --ok-soft: #0b2e1a; --warn: #fbbf24; --warn-soft: #3a2a05; --err: #f87171; --err-soft: #3b1111;
  --rail-bg: #060b16; --rail-text: #b7c0d3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35); --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  --note-bg: #2a2208; --note-border: #5b4a12; --note-text: #fcd34d; --note-title: #fbbf24;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #111a2b; --surface-2: #17213a; --border: #253150; --border-strong: #33415e;
  --text: #e5e9f2; --text-2: #b7c0d3; --text-3: #7d8aa5;
  --primary: #38bdf8; --primary-2: #7dd3fc; --primary-soft: #0c2a3d;
  --ok: #4ade80; --ok-soft: #0b2e1a; --warn: #fbbf24; --warn-soft: #3a2a05; --err: #f87171; --err-soft: #3b1111;
  --rail-bg: #060b16; --rail-text: #b7c0d3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35); --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  --note-bg: #2a2208; --note-border: #5b4a12; --note-text: #fcd34d; --note-title: #fbbf24;
  color-scheme: dark;
} }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; color: var(--text); background: var(--bg);
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { fill: currentColor; }
a { color: var(--primary); }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: 24px; } h2 { font-size: 19px; } h3 { font-size: 16px; } h4 { font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
p { margin: 0 0 8px; line-height: 1.5; }
.muted { color: var(--text-2); } .small { font-size: 13px; } .mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ---------- Uygulama iskeleti ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) 1fr 0; height: 100vh; height: 100dvh; overflow: hidden; }
.app.guide-open { grid-template-columns: var(--rail-w) 1fr var(--guide-w); }

.rail { background: var(--rail-bg); color: var(--rail-text); display: flex; flex-direction: column; align-items: stretch; padding: 8px 6px; gap: 2px; overflow-y: auto; }
.rail-brand { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 14px; color: #fff; }
.rail-brand-text { font-weight: 800; font-size: 12px; letter-spacing: .04em; }
.rail-btn { background: transparent; border: 0; color: var(--rail-text); border-radius: 10px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 600; }
.rail-btn svg { width: 24px; height: 24px; }
.rail-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.rail-btn.active { background: var(--primary); color: #fff; }
.rail-btn:disabled { opacity: .35; cursor: not-allowed; }
.rail-spacer { flex: 1; }
.rail-status { font-size: 10.5px; text-align: center; padding: 8px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-3); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--text-3); }
.dot.ok { background: #22c55e; } .dot.busy { background: var(--accent); animation: pulse 1s infinite; } .dot.err { background: #ef4444; }
@keyframes pulse { 50% { opacity: .3; } }

.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); min-height: 58px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs .sep { color: var(--text-3); }
.crumbs .crumb-link { color: var(--text-2); background: none; border: 0; padding: 4px 6px; border-radius: 6px; font-weight: 600; }
.crumbs .crumb-link:hover { background: var(--surface-2); color: var(--text); }
.crumbs .current { color: var(--text); font-size: 17px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.search-box { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 12px; height: 40px; width: 240px; }
.search-box svg { width: 18px; height: 18px; color: var(--text-3); flex: none; }
.search-box input { border: 0; background: transparent; outline: 0; width: 100%; font-size: 14px; }
.online-badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
.online-badge.off { background: var(--warn-soft); color: var(--warn); }

.content { flex: 1; overflow: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.content.no-pad { padding: 0; }

/* ---------- Rehber paneli ---------- */
.guide-head strong { flex: 1; }
.guide { background: var(--surface); border-left: 1px solid var(--border); display: none; flex-direction: column; overflow: hidden; }
.app.guide-open .guide { display: flex; }
.guide-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
.guide-body { overflow: auto; padding: 16px; line-height: 1.55; font-size: 14px; }
.guide-body h3 { margin: 0 0 6px; font-size: 16px; }
.guide-body h4 { margin: 14px 0 6px; }
.guide-body .g-fig { margin: 10px 0 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
.guide-body .g-fig svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 6px; }
.guide-body .g-fig figcaption { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
.guide-body ul { padding-left: 18px; margin: 6px 0; }
.guide-body li { margin: 3px 0; }
.guide-body .g-field { border-left: 3px solid var(--primary-2); padding: 6px 10px; margin: 8px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.guide-body .g-field b { display: block; color: var(--primary); }
.guide-body code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }
.guide-body .tip { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.guide-body .example { background: var(--ok-soft); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
/* "Bu ekranda ne var?" bloğu */
.guide-body .g-screen { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 10px; padding: 8px 12px; margin: 8px 0 14px; }
.guide-body .g-screen summary { cursor: pointer; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
.guide-body .g-screen summary::before { content: '▸'; color: var(--note-title); transition: transform .15s; }
.guide-body .g-screen[open] summary::before { transform: rotate(90deg); }
.guide-body .g-screen summary span { font-size: 12px; color: var(--note-title); font-weight: 600; }
.guide-body .g-screen ul { padding-left: 16px; margin: 8px 0 2px; }
.guide-body .g-screen li { margin: 5px 0; font-size: 13.5px; line-height: 1.45; }
.guide-body .g-screen li b { color: var(--note-text); }
.guide-body .g-screen h4 { margin: 10px 0 4px; }
.guide-body .g-screen-cols li b { color: var(--primary); }
.guide-body .g-screen-cols li i { color: var(--text-3); font-size: 12px; }
/* belge tarzı şekiller */
.guide-body .g-fig.doc { padding: 12px; }
.guide-body figure.g-fig { cursor: zoom-in; }
.guide-body figure.g-fig.zoomed { cursor: default; margin: 0; }
.guide-body figure.g-fig.zoomed svg { max-width: 900px; margin: 0 auto; }
@media (min-width: 1500px) { :root { --guide-w: 440px; } }
.guide-body .g-fig figcaption.top { margin: 0 0 10px; font-size: 13.5px; color: var(--text); line-height: 1.45; }
.guide-body .g-fig figcaption.top b { color: var(--text); }
.guide-body .fig-n { font-family: var(--mono); font-size: 12px; color: var(--primary); font-weight: 700; }
.guide-body .g-fig .note { margin-top: 8px; font-size: 12.5px; color: var(--text-2); line-height: 1.45; border-top: 1px dashed var(--border); padding-top: 6px; }
.guide-body .g-rule { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; font-size: 13.5px; line-height: 1.45; }
.guide-body .g-rule .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: var(--surface); font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.guide-body .g-rule b { color: var(--text); }
.guide-body p b:first-child { color: var(--text); }

/* ---------- Genel bileşenler ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--touch); padding: 0 18px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); font-weight: 600; font-size: 15px; white-space: nowrap; }
.btn svg { width: 20px; height: 20px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .rail-btn.active { color: #06121f; }
.btn.primary:hover { filter: brightness(.92); }
.btn.danger { color: var(--err); border-color: #fca5a5; }
.btn.danger:hover { background: var(--err-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn.lg { min-height: 54px; font-size: 16px; padding: 0 24px; }
.btn.block { width: 100%; }
.icon-btn { background: transparent; border: 0; width: 42px; height: 42px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { background: var(--err-soft); color: var(--err); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.grid.c2 { grid-template-columns: repeat(2, 1fr); } .grid.c3 { grid-template-columns: repeat(3, 1fr); } .grid.c4 { grid-template-columns: repeat(4, 1fr); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
.badge.info { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.15); flex: none; }

/* Form alanları */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.field label .req { color: var(--err); }
.help-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; border: 0; padding: 0; cursor: pointer; flex: none; }
.help-dot:hover { background: var(--primary); color: #fff; }
.input, .select, .textarea { min-height: var(--touch); padding: 8px 12px; border: 1.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); width: 100%; outline: 0; font-size: 15px; }
.textarea { min-height: 80px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-soft); }
.input.err { border-color: var(--err); background: var(--err-soft); }
.input.warn { border-color: var(--warn); }
.input[readonly] { background: var(--surface-2); color: var(--text-2); }
.field .hint { font-size: 12px; color: var(--text-3); }
.field .error { font-size: 12.5px; color: var(--err); font-weight: 600; }

/* ---------- Sekmeler ---------- */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 0 14px; min-height: 50px; font-weight: 600; color: var(--text-2); font-size: 14.5px; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab .cnt { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-size: 11.5px; min-width: 20px; text-align: center; color: var(--text-2); }
.tab.has-err .cnt { background: var(--err-soft); color: var(--err); border-color: transparent; }

/* ---------- Loglama düzeni ---------- */
.log-layout { display: grid; grid-template-columns: 1fr 300px; height: 100%; min-height: 0; }
.log-layout.strip-hidden { grid-template-columns: 1fr; }
.log-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.log-head { background: var(--surface); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.log-head .hole-id { font-size: 22px; font-weight: 800; }
.log-head .progress { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.progress-bar { flex: 1; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress-bar > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.log-body { flex: 1; overflow: auto; padding: 12px 16px 0; }
.log-strip { border-left: 1px solid var(--border); background: var(--surface); overflow: auto; }

.infostrip { display: flex; gap: 14px; align-items: flex-start; background: var(--primary-soft); border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
.infostrip .is-icon { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 800; }
.infostrip .is-body { flex: 1; min-width: 0; }
.infostrip .is-body > b { display: block; margin-bottom: 2px; }
.infostrip .is-actions { display: flex; gap: 6px; flex: none; }
.infostrip.collapsed .is-body p { display: none; }

/* Tablo (grid) */
.tbl-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table.grid-t { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; }
.grid-t th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.grid-t th .help-dot { margin-left: 4px; vertical-align: middle; }
.grid-t td { padding: 5px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
.grid-t tr:last-child td { border-bottom: 0; }
.grid-t tr.selected td { background: var(--primary-soft); }
.grid-t tr.has-err td { background: var(--err-soft); }
.grid-t td .input, .grid-t td .select { min-height: 42px; padding: 6px 10px; font-size: 14.5px; }
.grid-t td .input.num { text-align: right; font-family: var(--mono); width: 96px; }
.grid-t td .input.txt { min-width: 180px; }
.grid-t td .rowno { color: var(--text-3); font-size: 12px; padding-top: 12px; text-align: center; font-family: var(--mono); }
.grid-t td .calc { display: inline-block; min-height: 42px; line-height: 42px; padding: 0 10px; font-family: var(--mono); color: var(--text-2); background: var(--surface-2); border-radius: 8px; min-width: 70px; text-align: right; white-space: nowrap; }
.grid-t td.actions { white-space: nowrap; }
.row-err { font-size: 12px; color: var(--err); padding: 2px 8px 4px; font-weight: 600; }
.row-warn { font-size: 12px; color: var(--warn); padding: 2px 8px 4px; font-weight: 600; }
.tbl-empty { padding: 36px 16px; text-align: center; color: var(--text-2); }
.tbl-empty b { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }

/* Kod seçici butonu (dokunmatik) */
.pick { min-height: 42px; border: 1.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); padding: 4px 10px; display: inline-flex; align-items: center; gap: 8px; min-width: 120px; text-align: left; font-size: 14.5px; }
.pick:hover { border-color: var(--primary-2); }
.pick .pk-code { font-weight: 700; font-family: var(--mono); }
.pick .pk-name { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

  ['Proje standardına göre benzersiz kuyu adı. Örn: FX-24-001', 'Unique hole name per project standard. E.g. FX-24-001'], ['Kuyu ağzı koordinatı (projeksiyon sistemi ayarlarda).', 'Collar coordinate (projection given in coordinate system).'], ['Örn: UTM 36N ED50, ITRF96 TM33', 'E.g. UTM 36N ED50, ITRF96 TM33'], ['Kuyu ağzındaki planlanan azimut.', 'Planned azimuth at the collar.'], ['Aşağı doğru negatif. Dik kuyu = −90.', 'Negative downwards. Vertical hole = −90.'], ['Sondaj bitince gerçek derinlik. Log aralıkları bunu aşamaz.', 'Actual depth when drilling ends. Log intervals cannot exceed it.'],
  /* tablo 'what' metinleri */
  ['Karotun kaya türünü ve fiziksel özelliklerini <b>bitişik aralıklar</b> halinde tanımlarsınız. Her aralığın <b>Bitiş</b> derinliği bir sonrakinin <b>Başlangıç</b> derinliğidir; boşluk veya çakışma olamaz. Kayanın adı, tane boyu, rengi ve ayrışma derecesi ile kısa bir açıklama yazın.', 'Describe the rock type and physical properties of the core as <b>contiguous intervals</b>. Each interval’s <b>To</b> depth is the next one’s <b>From</b>; no gaps or overlaps. Enter rock name, grain size, colour, weathering grade and a short description.'],
  ['Hidrotermal alterasyonun <b>türünü</b>, <b>şiddetini (0–4)</b> ve <b>stilini</b> aralıklar halinde kaydedin. Aynı aralıkta iki alterasyon varsa Alt 1 ve Alt 2 kullanın. Alterasyon olmayan yerler boş bırakılabilir (bitişik olmak zorunda değildir).', 'Record the <b>type</b>, <b>intensity (0–4)</b> and <b>style</b> of hydrothermal alteration as intervals. Use Alt 1 and Alt 2 when two alterations overlap. Unaltered intervals may be left out (intervals need not be contiguous).'],
  ['Cevher minerallerini aralık bazında girin: <b>mineral</b>, <b>yoğunluk (1–5, hacim %)</b> ve <b>oluş biçimi</b> (saçınımlı, damar, kırık dolgusu…). Bir aralıkta en fazla üç mineral kaydedilebilir; en bol olanı Min 1 yapın. Toplam sülfid yüzdesi görsel tahmindir.', 'Enter ore minerals per interval: <b>mineral</b>, <b>intensity (1–5, vol. %)</b> and <b>form</b> (disseminated, vein, fracture fill…). Up to three minerals per interval; the most abundant is Min 1. Total sulphide % is a visual estimate.'],
  ['Nokta ölçümlerdir: her yapısal düzlem için <b>derinlik</b>, <b>tür</b>, karot eksenine göre <b>alfa açısı (0–90°)</b> ve yönlü karotta <b>beta açısı (0–360°)</b> girilir. Dolgu ve pürüzlülük jeoteknik değerlendirme için önemlidir.', 'Point measurements: for each structural plane enter <b>depth</b>, <b>type</b>, <b>alpha angle (0–90°)</b> to the core axis and, for oriented core, <b>beta angle (0–360°)</b>. Infill and roughness matter for geotechnical assessment.'],
  ['Her <b>manevra (run)</b> için ölçüm yapılır: manevra başlangıç-bitiş, çıkan karot uzunluğu ve <b>≥10 cm sağlam parçaların toplamı</b>. Sistem <b>TCR %</b> (karot geri kazanımı) ve <b>RQD %</b>’yi otomatik hesaplar. Kırık sayısı ile kırık sıklığı (FF/m) hesaplanır.', 'Measured per <b>drill run</b>: run from-to, recovered core length and the <b>sum of sound pieces ≥10 cm</b>. The system calculates <b>TCR %</b> (core recovery) and <b>RQD %</b> automatically. Fracture count gives fracture frequency (FF/m).'],
  ['Analize gönderilecek karot örneklerini tanımlayın. <b>Numune No</b> etiketle birebir aynı olmalıdır. Kalite kontrol için düzenli aralıklarla <b>Standart</b>, <b>Blank</b> ve <b>Duplikat</b> ekleyin (öneri: her 20 örnekte 1 STD + 1 BLK + 1 DUP). QAQC örneklerinde derinlik girmeyin; duplikatta orijinal numarayı yazın.', 'Define core samples sent for assay. <b>Sample ID</b> must match the tag exactly. Insert <b>Standards</b>, <b>Blanks</b> and <b>Duplicates</b> at regular intervals for quality control (suggested: 1 STD + 1 BLK + 1 DUP per 20 samples). Do not enter depths for QAQC samples; give the original ID for duplicates.'],
  ['Kuyu içi <b>sapma (survey)</b> ölçümleri: her derinlikte ölçülen azimut ve eğim. Ağız (0 m) değeri başlıktan otomatik önerilir. Eğim negatif = aşağı doğru.', 'Downhole <b>survey</b> measurements: azimuth and dip at each depth. The collar (0 m) value is suggested from the header. Negative dip = downwards.'],

  ['Numunelerin laboratuvara <b>sevk partileri</b> ve gözetim zinciri: parti numarası, sevk tarihi, laboratuvar, iş numarası, analiz yöntemi, kargo bilgisi, mühürleyen kişi ve laboratuvara teslim tarihi. Numune sekmesinde her numune bir partiye bağlanır. JORC Tablo 1 “numune güvenliği” ve “analiz verisi kalitesi” satırları bu kayıttan doldurulur.', 'Sample <b>dispatch batches</b> to the laboratory and chain of custody: batch number, dispatch date, laboratory, job number, analysis method, courier, sealer and lab receipt date. Every sample in the Samples tab is linked to a batch. JORC Table 1 “sample security” and “quality of assay data” are answered from this record.'],
  ['CSV dosyasını içe aktarın: ilk sütun <b>Numune No</b>, diğer sütunlar element (örn. Au_ppm; Cu_pct). İçe aktarırken laboratuvar, iş no, yöntem, birim ve dedeksiyon limitini girin; <b>&lt;0.01</b> gibi dedeksiyon altı değerler işaretli saklanır ve hesaplarda yarı limit alınır.', 'Import a CSV: first column <b>Sample ID</b>, other columns elements (e.g. Au_ppm; Cu_pct). Enter laboratory, job no, method, units and detection limits on import; below-detection values such as <b>&lt;0.01</b> are stored flagged and half the limit is used in calculations.'],
  ['Sevk irsaliyesindeki parti/batch numarası. Örn: FX-D2026-014. Benzersiz olmalı.', 'Batch number on the dispatch note, e.g. FX-D2026-014. Must be unique.'], ['Numunelerin sahadan çıktığı tarih.', 'Date the samples left site.'], ['Laboratuvar adı ve şubesi. Örn: ALS Global – İzmir.', 'Laboratory name and branch, e.g. ALS Global – Izmir.'], ['Laboratuvarın verdiği iş/job numarası; sertifika bu numarayla gelir.', 'Job number issued by the lab; the certificate carries it.'], ['Lab yöntem kodları. Örn: Au-AA25 (fire assay 30 g), ME-ICP61.', 'Lab method codes, e.g. Au-AA25 (30 g fire assay), ME-ICP61.'], ['Taşıyıcı firma ve irsaliye numarası.', 'Carrier and waybill number.'], ['Torbaları mühürleyip sevki hazırlayan kişi.', 'Person who sealed the bags and prepared the dispatch.'], ['Laboratuvarın numuneleri teslim aldığı tarih (lab bildiriminden).', 'Date the lab received the samples (from the lab notice).'],

/** dikey karot sütunu: parçalar üstten alta; sayısal sonuçları kendisi hesaplar */
function rqdWorked({ fromM, runCm, pieces, scale = 1.15 }) {
  const x0 = 62, cw = 44, top = 24, labelX = 118;
  let y = top, totalCore = 0, rqdSum = 0, out = '';
  for (const p of pieces) {
    const h = Math.max(4, p.cm * scale);
    const sound = !p.lost && p.cm >= 10;
    if (!p.lost) totalCore += p.cm; if (sound) rqdSum += p.cm;
    if (p.lost) out += `<rect x="${x0}" y="${y}" width="${cw}" height="${h}" fill="#fff" stroke="#57534e" stroke-dasharray="3 2"/>${txt(x0 + cw / 2, y + h / 2 + 3, 'kayıp', { size: 7.5, anchor: 'middle', fill: C.mut })}`;
    else out += `<rect x="${x0}" y="${y}" width="${cw}" height="${h - 2}" fill="${sound ? C.teal : C.grey}" stroke="#334155" stroke-width=".6"/>`;
    const ly = y + h / 2 + 3;
    out += txt(labelX, ly, `${p.cm} cm`, { size: 9, mono: true, fill: p.lost ? C.mut : C.ink });
    if (p.lost) out += txt(labelX + 48, ly, 'kayıp — manevraya dahil', { size: 8, fill: C.mut });
    else if (sound) out += `${ok(labelX + 50, ly - 2)}${txt(labelX + 60, ly, '≥ 10 cm — RQD’ye sayar', { size: 8, fill: C.green })}`;
    else out += `${bad(labelX + 50, ly - 2)}${txt(labelX + 60, ly, '< 10 cm — saymaz', { size: 8, fill: C.red })}`;
    y += h;
  }
  const H = y;
  // derinlik ölçeği (her 50 cm)
  let ticks = '';
  for (let cm = 0; cm <= runCm; cm += 50) { const ty = top + cm * scale; ticks += `<line x1="${x0 - 6}" y1="${ty}" x2="${x0 - 2}" y2="${ty}" stroke="#334155"/>${txt(x0 - 9, ty + 3.5, (fromM + cm / 100).toFixed(2) + ' m', { size: 8, anchor: 'end', mono: true, fill: C.mut })}`; }
  const tcr = totalCore / runCm * 100, rqd = rqdSum / runCm * 100;
  const cls = rqd < 25 ? 'Çok zayıf' : rqd < 50 ? 'Zayıf' : rqd < 75 ? 'Orta' : rqd < 90 ? 'İyi' : 'Mükemmel';
  const by = H + 10;
  const calc = `${box(8, by, 304, 78, '#f8fafc')}
    ${txt(16, by + 15, 'Manevra boyu', { size: 9, bold: true })}${txt(120, by + 15, `${runCm} cm`, { size: 9, mono: true })}
    ${txt(16, by + 30, 'Çıkan karot (kayıp hariç)', { size: 9, bold: true })}${txt(160, by + 30, `${totalCore} cm`, { size: 9, mono: true })}
    ${txt(16, by + 45, '≥ 10 cm parçalar', { size: 9, bold: true })}${txt(120, by + 45, pieces.filter(p => !p.lost && p.cm >= 10).map(p => p.cm).join(' + ') + ` = ${rqdSum} cm`, { size: 9, mono: true })}
    ${box(16, by + 52, 130, 20, '#fff', '#94a3b8')}${txt(22, by + 66, `TCR = ${totalCore}/${runCm} = %${tcr.toFixed(0)}`, { size: 9, mono: true })}
    ${box(154, by + 52, 150, 20, '#e0f2fe', C.blue)}${txt(160, by + 66, `RQD = ${rqdSum}/${runCm} = %${rqd.toFixed(0)} · ${cls}`, { size: 9, mono: true, bold: true, fill: C.blue })}`;
  return svg(320, by + 86, `${txt(x0 - 9, 14, 'Derinlik', { size: 8.5, anchor: 'end', fill: C.mut })}${txt(x0 + cw / 2, 14, 'Karot', { size: 8.5, anchor: 'middle', fill: C.mut })}${txt(labelX, 14, 'Parça boyu · eksen boyunca', { size: 8.5, fill: C.mut })}<line x1="${x0 - 2}" y1="${top}" x2="${x0 - 2}" y2="${H}" stroke="#334155"/>${ticks}${out}${calc}`);
}

/** Şekil: başlık üstte, açıklama, şekil, isteğe bağlı not */
const fig = (title, svgStr, desc = '', note = '') => `<figure class="g-fig doc"><figcaption class="top"><span class="fig-n">Şekil</span> · <b>${title}.</b> ${desc}</figcaption>${svgStr}${note ? `<div class="note">${note}</div>` : ''}</figure>`;
const nedir = (s) => `<p><b>Nedir.</b> ${s}</p>`;
const rules = (title, items) => `<h4>${title}</h4>${items.map((r, i) => `<div class="g-rule"><span class="n">${i + 1}</span><div><b>${r[0]}</b> ${r[1]}</div></div>`).join('')}`;
const where = (items) => `<h4>Uygulamada nereye yazılır?</h4><ul>${items.map(i => `<li><b>${i[0]}:</b> ${i[1]}</li>`).join('')}</ul>`;
const mistakes = (items) => `<h4>Sık hatalar</h4><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
const example = (s) => `<div class="example"><b>Örnek satır:</b> ${s}</div>`;

/** Bir kapsayıcıdaki şekilleri sırayla numaralar (Şekil 1, 2, …) */
function numberFigures(root) {
  let n = 0;
  root.querySelectorAll('figure.g-fig .fig-n').forEach(el => { n++; el.textContent = t('Şekil') + ' ' + n; });
  return n;
}

  content.className = 'content' + (view.noPad ? ' no-pad' : '');
  content.innerHTML = '';
  try { await view.render(content, app); }
  catch (e) { console.error(e); if (token === _renderToken) content.appendChild(h('div.card', h('div.card-b', h('h3', 'Görünüm hatası'), h('pre.small', e.stack || e.message)))); }
  if (!view.keepsGuide) app.guide(GUIDES[state.route] ? state.route : 'dashboard');
}

/* ---------- Statik metinler (index.html) ve tema ---------- */
function applyStatic() {
  document.querySelectorAll('[data-tr]').forEach(el => { el.textContent = t(el.dataset.tr); });
  document.querySelectorAll('[data-tr-title]').forEach(el => { el.title = t(el.dataset.trTitle); });
  document.querySelectorAll('[data-tr-ph]').forEach(el => { el.placeholder = t(el.dataset.trPh); });
  const ob = document.getElementById('onlineBadge'); if (ob) { ob.textContent = t(navigator.onLine ? 'Çevrimiçi' : 'Çevrimdışı — veriler cihazda'); }
  document.title = i18n.lang === 'en' ? 'CoreLog — Core Logging System' : 'CoreLog — Karot Loglama Sistemi';
}
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'dark' || mode === 'light') root.dataset.theme = mode; else delete root.dataset.theme;
  try { localStorage.setItem('corelog.theme', mode || 'system'); } catch (e) { /* yok say */ }
  const dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0b1220' : '#0f172a');
}

/* ---------- Başlangıç ---------- */
async function init() {
  loadLang();
  try { applyTheme(localStorage.getItem('corelog.theme') || 'system'); } catch (e) { /* yok say */ }
  const backend = await db.open();
  if (backend === 'local') setTimeout(() => toast('Not: Bu ortamda basit depolama kullanılıyor; fotoğraf kapasitesi sınırlı. Düzenli yedek alın.', 'warn', 6000), 1500);
  state.projects = await db.getAll('projects');
  state.holes = await db.getAll('holes');
  const st = await db.getMeta('settings'); if (st) Object.assign(state.settings, st);
  const last = await db.getMeta('last');
  if (last) { state.projectId = last.projectId; state.holeId = last.holeId; state.tab = last.tab || 'litho'; }
  if (!state.projectId || !state.projects.find(p => p.id === state.projectId)) state.projectId = state.projects[0]?.id || null;
  if (state.holeId && !state.holes.find(x => x.id === state.holeId)) state.holeId = null;

  // Ray düğmeleri
  document.querySelectorAll('.rail-btn[data-route]').forEach(b => b.addEventListener('click', () => app.navigate(b.dataset.route)));
  document.getElementById('btnGuideToggle').addEventListener('click', () => app.toggleGuide());
  document.getElementById('btnGuideClose').addEventListener('click', () => app.toggleGuide());
  document.getElementById('btnGuideAll').addEventListener('click', () => { app.navigate('manual'); if (window.innerWidth <= 1180) app.toggleGuide(); });
  document.getElementById('btnMenu').addEventListener('click', () => document.getElementById('rail').classList.toggle('open'));
  document.addEventListener('click', (e) => { const rail = document.getElementById('rail'); if (rail.classList.contains('open') && !rail.contains(e.target) && e.target.id !== 'btnMenu' && !document.getElementById('btnMenu').contains(e.target)) rail.classList.remove('open'); });

  // Arama
  const gs = document.getElementById('globalSearch');
  gs.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const q = gs.value.trim().toLowerCase(); if (!q) return;
    const hit = state.holes.find(x => (x.holeId || '').toLowerCase().includes(q));
    if (hit) { app.navigate('log', { projectId: hit.projectId, holeId: hit.id }); gs.value = ''; }
    else toast('Kuyu bulunamadı: ' + gs.value, 'warn');
  });

  // Çevrimiçi durumu
  const ob = document.getElementById('onlineBadge');
  const upd = () => { ob.textContent = t(navigator.onLine ? 'Çevrimiçi' : 'Çevrimdışı — veriler cihazda'); ob.classList.toggle('off', !navigator.onLine); };
  window.addEventListener('online', upd); window.addEventListener('offline', upd); upd();

  // Service worker (yalnızca http/https)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

  // Masaüstünde rehberi açık başlat
  if (window.innerWidth > 1400) document.getElementById('app').classList.add('guide-open');

  applyStatic();
  const seen = await db.getMeta('onboarded');
  app.navigate(last?.route && VIEWS[last.route] ? last.route : 'dashboard');
  if (!seen) showOnboarding();
}

  const step = (n, title, text, svg) => h('div.onb-step', h('div.n', n), h('b', title), h('div', { html: svg }), h('div', text));
  const body = h('div',
    h('p', 'CoreLog, sahada karot loglamayı adım adım yönlendirir. Her ekranda sağdaki ', h('b', 'Rehber'), ' paneli ve alan yanındaki ', h('span.help-dot', '?'), ' işaretleri ne gireceğinizi yazılı ve görsel olarak anlatır.'),
    h('div.onb-steps',
      step(1, 'Proje & kuyu', 'Proje oluşturun, kuyu ekleyin, başlık (collar) bilgilerini girin.', `<svg viewBox="0 0 120 70"><rect x="10" y="10" width="100" height="50" rx="8" fill="#e0f2fe"/><rect x="20" y="20" width="30" height="30" rx="4" fill="#0284c7"/><rect x="58" y="20" width="42" height="8" rx="2" fill="#94a3b8"/><rect x="58" y="34" width="30" height="8" rx="2" fill="#cbd5e1"/></svg>`),
      step(2, 'Sekmelerle logla', 'Litoloji → Alterasyon → Mineralizasyon → Yapı → RQD → Numune. Kodları dokunarak seçin.', `<svg viewBox="0 0 120 70"><rect x="10" y="10" width="100" height="14" fill="#f1f5f9"/><rect x="12" y="12" width="26" height="10" fill="#0284c7"/><rect x="10" y="30" width="100" height="8" fill="#e2e8f0"/><rect x="10" y="42" width="100" height="8" fill="#e2e8f0"/><rect x="10" y="54" width="100" height="8" fill="#e2e8f0"/></svg>`),
      step(3, 'Anında doğrulama', 'Çakışma, boşluk, aralık dışı değer anında kırmızı/sarı işaretlenir.', `<svg viewBox="0 0 120 70"><rect x="10" y="12" width="100" height="14" fill="#fee2e2"/><rect x="10" y="30" width="100" height="14" fill="#fef3c7"/><rect x="10" y="48" width="100" height="14" fill="#dcfce7"/><text x="15" y="23" font-size="9" fill="#dc2626">✖ çakışma</text><text x="15" y="41" font-size="9" fill="#d97706">▲ boşluk</text><text x="15" y="59" font-size="9" fill="#16a34a">✔ tamam</text></svg>`),
      step(4, 'Şerit log & dışa aktar', 'Sağda canlı şerit log; CSV/JSON dışa aktarma ve yedekleme.', `<svg viewBox="0 0 120 70"><rect x="20" y="8" width="14" height="54" fill="#3b82f6"/><rect x="20" y="30" width="14" height="14" fill="#22c55e"/><rect x="40" y="8" width="8" height="54" fill="#fde68a"/><rect x="40" y="20" width="8" height="20" fill="#f59e0b"/><polyline points="60,60 66,40 72,50 78,20 84,30 90,12" fill="none" stroke="#16a34a" stroke-width="2"/></svg>`)
    ),
    state.projects.length ? null : h('p.small.muted', { style: { marginTop: '12px' } }, 'Henüz veri yok. Uygulamayı tanımak için demo projeyi yükleyebilirsiniz.')
  );
  modal({
    title: 'Hoş geldiniz', body, wide: true,
    actions: [
      ...(state.projects.length ? [] : [{ label: 'Demo verisini yükle', cls: 'primary', onClick: async () => { await db.setMeta('onboarded', true); await app.loadDemo(); } }]),
      { label: 'Kılavuzu aç', onClick: () => { db.setMeta('onboarded', true); app.navigate('manual'); } },
      { label: 'Başla', cls: state.projects.length ? 'primary' : '', onClick: () => db.setMeta('onboarded', true) }
    ]
  });
}

init().catch(e => { console.error(e); document.getElementById('content').innerHTML = `<div class="card"><div class="card-b"><h3>Başlatma hatası</h3><pre>${e.message}</pre></div></div>`; });
window.CoreLog = app;

exports.state = state;
});
  __require('js/app.js');
})();
