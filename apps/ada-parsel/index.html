<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ada Parsel Sondaj Raporu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f5f7; --kart:#ffffff; --kenar:#dcdfe4; --yazi:#1b1f24; --soluk:#5c6470;
  --vurgu:#0b5cad; --vurgu-acik:#e7f0fa;
  --iyi:#137a3d; --iyi-bg:#e6f4ec;
  --kotu:#b3261e; --kotu-bg:#fdeceb;
  --uyari:#8a5a00; --uyari-bg:#fdf3e2;
  --golge:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

.ust{background:#fff;border-bottom:1px solid var(--kenar);padding:14px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:900}
.ust h1{font-size:18px}
.ust .alt{color:var(--soluk);font-size:13px}
.rozet{margin-left:auto;font-size:12px;color:var(--soluk);
  background:var(--bg);border:1px solid var(--kenar);border-radius:20px;padding:4px 12px}

.form{background:#fff;border-bottom:1px solid var(--kenar);padding:14px 22px;
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.alan{display:flex;flex-direction:column;gap:5px}
.alan label{font-size:12px;font-weight:600;color:var(--soluk);text-transform:uppercase;letter-spacing:.04em}
select,input{font:inherit;padding:9px 11px;border:1px solid var(--kenar);border-radius:8px;
  background:#fff;color:var(--yazi);min-width:0}
select:focus,input:focus{outline:2px solid var(--vurgu);outline-offset:-1px;border-color:var(--vurgu)}
#ilce,#mahalle{min-width:200px}
#ada,#parsel{width:120px}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:8px;border:1px solid transparent;
  background:var(--vurgu);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:default}
button.ikincil{background:#fff;color:var(--yazi);border-color:var(--kenar)}

.duzen{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:18px;padding:18px 22px;align-items:start}
@media(max-width:1100px){.duzen{grid-template-columns:1fr}}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:12px;box-shadow:var(--golge);overflow:hidden}
.kart>h2{font-size:14px;padding:12px 16px;border-bottom:1px solid var(--kenar);
  background:#fafbfc;text-transform:uppercase;letter-spacing:.05em;color:var(--soluk)}
.govde{padding:16px}
#harita{height:520px;width:100%;background:#e8eaed}

.durum{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:10px;margin-bottom:10px;
  border:1px solid transparent;font-size:14px}
.durum .ikon{font-size:17px;line-height:1.3;flex:none}
.durum b{display:block;margin-bottom:2px}
.durum span{color:var(--soluk);font-size:13px}
.d-iyi{background:var(--iyi-bg);border-color:#b6ddc6;color:var(--iyi)}
.d-kotu{background:var(--kotu-bg);border-color:#f3c2bf;color:var(--kotu)}
.d-uyari{background:var(--uyari-bg);border-color:#ecd5a5;color:var(--uyari)}
.d-notr{background:var(--bg);border-color:var(--kenar);color:var(--yazi)}
.durum.d-iyi span,.durum.d-kotu span,.durum.d-uyari span{color:inherit;opacity:.82}

.kunye{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px;margin-bottom:4px}
.kunye dt{color:var(--soluk)}
.kunye dd{margin:0;font-weight:600}

.olcumler{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.olcum{background:var(--bg);border:1px solid var(--kenar);border-radius:10px;padding:11px 13px}
.olcum .k{font-size:11px;color:var(--soluk);text-transform:uppercase;letter-spacing:.04em}
.olcum .d{font-size:21px;font-weight:680;margin-top:3px;font-variant-numeric:tabular-nums}
.olcum .b{font-size:12px;color:var(--soluk);font-weight:500}

.sarma{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--kenar);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soluk);
  background:#fafbfc;position:sticky;top:0}
td.s{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--vurgu-acik)}
.tablo-kutu{max-height:340px;overflow:auto}

.bos{padding:30px 18px;text-align:center;color:var(--soluk);font-size:14px}
.hata{background:var(--kotu-bg);border:1px solid #f3c2bf;color:var(--kotu);
  padding:13px 15px;border-radius:10px;font-size:14px}
.ipucu{font-size:12px;color:var(--soluk);margin-top:12px;line-height:1.6}
a{color:var(--vurgu)}
.yukleniyor{padding:34px;text-align:center;color:var(--soluk)}

#serit{display:none;background:#fdf3e2;border-bottom:1px solid #ecd5a5;color:#8a5a00;
  padding:12px 22px;font-size:14px;line-height:1.5}
#serit b{font-weight:700}
#serit.gorun{display:block}
#jeoloji-tuval{width:100%;max-width:820px;border:1px solid var(--kenar);border-radius:8px;
  display:block;background:#f0f0f0;cursor:crosshair}
.jeo-duzen{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media(max-width:900px){.jeo-duzen{grid-template-columns:1fr}}
.lejant-kutu{border:1px solid var(--kenar);border-radius:8px;overflow:hidden;background:#fff}
.lejant-kutu img{width:100%;display:block}
.lejant-kutu .bas{font-size:11px;font-weight:600;color:var(--soluk);padding:7px 10px;
  border-bottom:1px solid var(--kenar);background:#fafbfc;text-transform:uppercase;letter-spacing:.05em}
.birimler{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.birimler td{padding:6px 8px;border-bottom:1px solid var(--kenar)}
.birimler .yama{width:34px}
.yama i{display:block;width:30px;height:16px;border:1px solid #999;border-radius:3px}
.sira{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;
  border-radius:5px;background:var(--vurgu);color:#fff;font-size:12px;font-weight:700;margin-right:6px}

@media print{
  .ust,.form,.ipucu,button,#serit{display:none!important}
  .duzen{grid-template-columns:1fr!important;padding:0}
  .kart{box-shadow:none}
  body{background:#fff}
  #harita{height:340px}
  /* jeoloji: harita kesiti ve lejant ayri sayfalara sigacak boyutta */
  .jeo-duzen{grid-template-columns:1fr}
  #jeoloji-tuval{max-height:160mm;width:auto;max-width:100%;margin:0 auto}
  .lejant-kutu{break-before:page}
  .lejant-kutu img{width:100%;max-height:262mm;object-fit:contain;object-position:top;display:block;break-inside:avoid;break-after:page}
  .lejant-kutu img:last-child{break-after:auto}
  .jeo-duzen > div:first-child{break-inside:avoid}
  .tablo-kutu{max-height:none;overflow:visible}
}
</style>
</head>
<body>

<div class="ust">
  <div>
    <h1>Ada Parsel Sondaj Raporu</h1>
    <div class="alt">Ankara &middot; DSİ kuyu kayıtları, yasak sahalar ve tahsise kapalı havzalar</div>
  </div>
  <div class="rozet" id="rozet"></div>
</div>

<div id="serit"></div>

<div class="form">
  <div class="alan">
    <label for="ilce">İlçe</label>
    <select id="ilce"></select>
  </div>
  <div class="alan">
    <label for="mahalle">Mahalle / Köy</label>
    <select id="mahalle"><option value="">— önce ilçe seçin —</option></select>
    <div id="mahalle-not" style="font-size:11px;color:var(--soluk);max-width:330px"></div>
  </div>
  <div class="alan">
    <label for="ada">Ada</label>
    <input id="ada" inputmode="numeric" placeholder="boş olabilir">
  </div>
  <div class="alan">
    <label for="parsel">Parsel</label>
    <input id="parsel" inputmode="numeric" placeholder="örn. 17">
  </div>
  <button id="sorgula">Rapor Çıkar</button>
  <div class="alan">
    <button id="yazdir" class="ikincil">PDF Kaydet</button>
    <div style="font-size:11px;color:var(--soluk);max-width:220px">Açılan pencerede yazıcı olarak <b>"PDF olarak kaydet"</b> seçin</div>
  </div>
</div>

<div class="duzen">
  <div class="kart">
    <h2>Harita</h2>
    <div id="harita"></div>
  </div>
  <div class="kart">
    <h2>Rapor</h2>
    <div class="govde" id="rapor">
      <div class="bos">İlçe ve mahalleyi seçip ada&nbsp;/&nbsp;parsel numarasını yazın.</div>
    </div>
  </div>
</div>

<div class="duzen" style="grid-template-columns:minmax(0,1fr)">
  <div class="kart">
    <h2>MTA Jeoloji Paftası</h2>
    <div class="govde" id="jeoloji">
      <div class="bos">Parsel sorgulandığında jeoloji paftası burada çıkar.</div>
    </div>
  </div>
</div>

<script>
"use strict";
const V = JSON.parse(document.getElementById('veri').textContent);
const YARICAP = 500;
const API_YEREL   = '/api/parsel';   // ADA-PARSEL.bat ile acildiginda
const API_DOGRUDAN = 'https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api/parsel';

const $ = s => document.querySelector(s);
const M_LAT = 111320;
const mLon = lat => 111320 * Math.cos(lat * Math.PI / 180);

function kenaraMesafe(p, a, b){
  const k = mLon(p[1]);
  const px=p[0]*k, py=p[1]*M_LAT, ax=a[0]*k, ay=a[1]*M_LAT, bx=b[0]*k, by=b[1]*M_LAT;
  const vx=bx-ax, vy=by-ay, L=vx*vx+vy*vy;
  let t = L ? ((px-ax)*vx + (py-ay)*vy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(ax+t*vx), py-(ay+t*vy));
}
function halkaIcinde(p, ring){
  let ic = false;
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if( (yi>p[1]) !== (yj>p[1]) && p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi ) ic = !ic;
  }
  return ic;
}
function poligonIcinde(p, halkalar){
  if(!halkaIcinde(p, halkalar[0])) return false;
  for(let i=1;i<halkalar.length;i++) if(halkaIcinde(p, halkalar[i])) return false;
  return true;
}
function poligonaMesafe(p, halkalar){
  let en = Infinity;
  for(const r of halkalar)
    for(let i=0;i<r.length-1;i++) en = Math.min(en, kenaraMesafe(p, r[i], r[i+1]));
  return en;
}
function alanHesapla(ring){
  let t = 0;
  const lat0 = ring.reduce((s,p)=>s+p[1],0)/ring.length, k = mLon(lat0);
  for(let i=0, j=ring.length-1; i<ring.length; j=i++)
    t += (ring[j][0]*k)*(ring[i][1]*M_LAT) - (ring[i][0]*k)*(ring[j][1]*M_LAT);
  return Math.abs(t/2);
}
const sayi = (n,b=0) => n.toLocaleString('tr-TR',{minimumFractionDigits:b,maximumFractionDigits:b});
const ort = a => a.reduce((x,y)=>x+y,0)/a.length;
function medyan(a){
  if(!a.length) return 0;
  const s=[...a].sort((x,y)=>x-y), m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
const kacir = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ilceSec = $('#ilce'), mahalleSec = $('#mahalle');
ilceSec.innerHTML = '<option value="">— ilçe seçin —</option>' +
  V.idari.ilceler.map((i,x)=>'<option value="'+x+'">'+kacir(i.ad)+'</option>').join('');
ilceSec.onchange = () => {
  const i = V.idari.ilceler[ilceSec.value];
  mahalleSec.innerHTML = i
    ? '<option value="">— mahalle seçin —</option>' +
      i.mahalleler.map(m=>'<option value="'+m.id+'">'+kacir(m.ad)+
        (m.p===1 ? '  ◆ 1/25.000 pafta' : m.p===3 ? '  ◈ 1/100.000 pafta' : m.p===2 ? '  ◇ kâğıt pafta (yaklaşık)' : '')+'</option>').join('')
    : '<option value="">— önce ilçe seçin —</option>';
  if(i){
    const v=i.mahalleler.filter(m=>m.p===1).length, y=i.mahalleler.filter(m=>m.p===3).length, k=i.mahalleler.filter(m=>m.p===2).length;
    $('#mahalle-not').textContent = (v||y||k)
      ? i.ad+': '+[v?v+' ◆ 1/25.000':'', y?y+' ◈ 1/100.000':'', k?k+' ◇ kâğıt':''].filter(Boolean).join(', ')+' / '+i.mahalleler.length+' mahalle'
      : i.ad+' için elimizde jeoloji paftası yok';
  } else $('#mahalle-not').textContent='';
};
$('#rozet').textContent =
  sayi(V.kuyu.length)+' DSİ kuyusu · '+V.yasak.length+' yasak saha · '+V.havza.length+' kapalı havza';

const harita = L.map('harita').setView([39.93, 32.85], 10);
/* OpenStreetMap, dosyadan (file://) acilan sayfalara 403 veriyor; Esri vermiyor. */
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const altSokak = L.tileLayer(ESRI+'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'&copy; Esri'});
const altUydu  = L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',   {maxZoom:19, attribution:'&copy; Esri'});
const altTopo  = L.tileLayer(ESRI+'World_Topo_Map/MapServer/tile/{z}/{y}/{x}',  {maxZoom:19, attribution:'&copy; Esri'});
altSokak.addTo(harita);

const katmanYasak = L.layerGroup().addTo(harita);
const katmanHavza = L.layerGroup().addTo(harita);
const katmanIs = L.layerGroup().addTo(harita);
const cevir = h => h.map(r => r.map(p => [p[1], p[0]]));

V.yasak.forEach(y => L.polygon(cevir(y.h),
  {color:'#b3261e', weight:1, fillOpacity:.16}).bindTooltip('Yasak saha: '+y.ad).addTo(katmanYasak));
V.havza.forEach(h => L.polygon(cevir(h.h),
  {color:'#8a5a00', weight:1, fillOpacity:.08, dashArray:'5,4'})
  .bindTooltip('Tahsise kapalı: '+h.ad).addTo(katmanHavza));
L.control.layers({'Sokak':altSokak, 'Uydu':altUydu, 'Topoğrafik':altTopo},
  {'Yasak sahalar':katmanYasak, 'Tahsise kapalı havzalar':katmanHavza},
  {collapsed:false}).addTo(harita);

const goster = h => { $('#rapor').innerHTML = h; };

function halkalariAl(g){
  if(!g) return null;
  if(g.type === 'Polygon') return g.coordinates;
  if(g.type === 'MultiPolygon') return g.coordinates[0];
  return null;
}

async function sorgula(){
  const mahalleId = mahalleSec.value;
  const ada = ($('#ada').value || '0').trim() || '0';
  const parsel = ($('#parsel').value || '').trim();
  if(!mahalleId) return goster('<div class="hata">Önce ilçe ve mahalle seçin.</div>');
  if(!parsel) return goster('<div class="hata">Parsel numarasını yazın.</div>');

  goster('<div class="yukleniyor">TKGM sorgulanıyor…</div>');
  $('#sorgula').disabled = true;
  const yol = '/'+mahalleId+'/'+encodeURIComponent(ada)+'/'+encodeURIComponent(parsel);
  try{
    let d = null, ilkHata = null, sunucuKonustu = false;
    /* 1) ADA-PARSEL.bat ile açıldıysa yerel sunucu TKGM'ye aracılık eder */
    try{
      const y = await fetch(API_YEREL + yol);
      sunucuKonustu = true;
      if(y.ok) d = await y.json();
      else { const h = await y.json().catch(()=>({})); ilkHata = new Error(h.hata || ('HTTP '+y.status)); }
    }catch(e){ ilkHata = e; }
    /* Sunucu cevap verdiyse o cevap doğrudur — yedek yola sapma, yoksa
       "parsel bulunamadı" gibi net bir cevap yanıltıcı bir hatayla örtülür. */
    if(!d && sunucuKonustu) throw ilkHata;
    /* 2) sunucu yoksa (dosyaya çift tıklanmışsa) doğrudan TKGM'yi dene */
    if(!d){
      try{
        const y = await fetch(API_DOGRUDAN + yol);
        if(y.ok) d = await y.json();
        else{
          let m = (await y.text()).replace(/^"|"$/g,'');
          try{ const j = JSON.parse(m); m = j.Message || j.message || m; }catch(_){}
          const h = new Error(m || ('TKGM servisi yanıt vermedi (HTTP '+y.status+')'));
          h.tkgmCevapladi = true;                 // servis ulasildi, cevabi bu
          throw h;
        }
      }catch(e){ throw (ilkHata && /limit/i.test(ilkHata.message)) ? ilkHata : e; }
    }
    if(!d || !d.properties) throw new Error('Bu ada/parsel bulunamadı.');
    raporla(d);
  }catch(e){
    if(YEREL === false && !e.tkgmCevapladi){
      goster('<div class="hata"><b>TKGM’ye ulaşılamadı.</b>' +
        '<div class="ipucu">Sayfa dosyadan açıldı ve TKGM bu isteği kabul etmedi. ' +
        'Masaüstündeki <b>ADA PARSEL</b> kısayoluyla açın; sorgu yerel sunucu üzerinden gider.<br>' +
        '(TKGM’nin "günlük limit" uyarısı yanıltıcı — kota dolmadı.)</div></div>');
    } else {
      const yok = /bulunamad/i.test(e.message), limit = /limit/i.test(e.message);
      goster('<div class="hata"><b>' +
        (yok ? 'Bu ada/parsel seçtiğiniz mahallede kayıtlı değil.'
         : limit && YEREL === false ? 'TKGM, tarayıcıdan gelen sorguyu engelledi.'
         : 'Sorgu başarısız.') +
        '</b><br>' + kacir(e.message) +
        '<div class="ipucu">' + (yok
          ? 'Aynı adın imarlı/imarsız iki mahallesi olabilir (örn. “Bahçeleriçi” ve ' +
            '“Bahçeleriçi-İmar”). Listeden diğerini seçip tekrar deneyin.'
          : limit && YEREL === false
          ? 'Kota dolmadı — TKGM, dosyadan açılan sayfanın doğrudan çağrısını gün içinde bir süre sonra ' +
            'kesiyor. Bu pencereyi kapatın, masaüstündeki <b>ADA PARSEL</b> kısayoluyla açın: sorgu yerel ' +
            'sunucu üzerinden gider, TKGM onu kesmez.'
          : 'TKGM servisi bakımda olabilir, birkaç dakika sonra deneyin.') +
        '</div></div>');
    }
  }finally{ $('#sorgula').disabled = false; }
}

function raporla(d){
  let p = d.properties, halkalar = halkalariAl(d.geometry), devirNotu = '';

  if(!halkalar && p.gittigiParselListe){
    try{
      const yeni = JSON.parse(p.gittigiParselListe).features[0];
      halkalar = halkalariAl(yeni.geometry);
      devirNotu = '<div class="durum d-uyari"><span class="ikon">⇄</span><div>' +
        '<b>Bu parsel devredilmiş</b><span>' + kacir(p.gittigiParselSebep||'') +
        '<br>Yeni parsel: <b>' + kacir(yeni.properties.ozet) + '</b> — aşağıdaki rapor yeni parselin sınırına göre hazırlandı.</span></div></div>';
      p = Object.assign({}, yeni.properties);
    }catch(e){}
  }
  if(!halkalar)
    return goster('<div class="hata"><b>Bu parselin sınır bilgisi yok.</b><br>TKGM kaydında geometri bulunmuyor, konum belirlenemedi.</div>');

  const dis = halkalar[0];
  const merkez = [ort(dis.map(q=>q[0])), ort(dis.map(q=>q[1]))];

  const tkgmAlan = parseFloat(String(p.alan||'').replace(/\./g,'').replace(',','.'));
  const alan = (isFinite(tkgmAlan) && tkgmAlan > 0) ? tkgmAlan : alanHesapla(dis);

  const noktalar = [merkez].concat(dis);
  let yasakIci = null, yasakEnYakin = {ad:null, m:Infinity};
  for(const y of V.yasak){
    if(noktalar.some(q => poligonIcinde(q, y.h))){ yasakIci = y; break; }
    const m = poligonaMesafe(merkez, y.h);
    if(m < yasakEnYakin.m) yasakEnYakin = {ad:y.ad, m:m};
  }
  let havzaIci = null;
  for(const h of V.havza) if(poligonIcinde(merkez, h.h)){ havzaIci = h; break; }

  const yakin = [];
  for(const k of V.kuyu){
    if(Math.abs(k[1]-merkez[1]) > 0.0075) continue;
    if(Math.abs(k[0]-merkez[0]) > 0.0098) continue;
    let m = Infinity;
    for(let i=0;i<dis.length-1;i++) m = Math.min(m, kenaraMesafe(k, dis[i], dis[i+1]));
    if(poligonIcinde(k, halkalar)) m = 0;
    if(m <= YARICAP) yakin.push({k:k, m:m});
  }
  yakin.sort((a,b)=>a.m-b.m);

  const derinlikler = yakin.map(o=>o.k[2]).filter(x=>x>0);
  const statikler = yakin.map(o=>o.k[3]).filter(x=>x>0);
  const akiferSayim = {};
  yakin.forEach(o => { const a = V.akifer[o.k[5]]; akiferSayim[a] = (akiferSayim[a]||0)+1; });
  const akiferSirali = Object.keys(akiferSayim).map(a=>[a,akiferSayim[a]]).sort((a,b)=>b[1]-a[1]);

  const bs = [];
  bs.push(devirNotu);

  /* Tek satir sonuc: iki katmani birlestirip ne anlama geldigini soyle */
  bs.push(yasakIci
    ? '<div class="durum d-kotu" style="font-size:15px"><span class="ikon">■</span><div>' +
      '<b>SONUÇ: SONDAJ YAPILAMAZ</b><span>Parsel DSİ yasak sahası içinde.</span></div></div>'
    : havzaIci
    ? '<div class="durum d-kotu" style="font-size:15px"><span class="ikon">■</span><div>' +
      '<b>SONUÇ: YASAKLI — TAHSİSE KAPALI HAVZA (' + kacir(havzaIci.ad) + ')</b><span>DSİ bu havzada ' +
      'yeni su tahsisi vermiyor; yeni kuyuya izin çıkmaz. (DSİ’nin çizdiği yasak saha poligonlarından ' +
      'birinde değil — ama sonuç aynı: tahsis olmadan kuyu açılamaz.)</span></div></div>'

const JEO_PENCERE = 1600;      // haritada gosterilecek kenar uzunlugu (metre)
const JEO_CEVRE   = 1000;      // "cevredeki birimler" yaricapi (metre)

function kapsananMahalle(){
  let n = 0, t = 0;
  V.idari.ilceler.forEach(i => i.mahalleler.forEach(m => { t++; if(m.p) n++; }));
  return n + ' / ' + t;
}
function jeoPiksel(p, lon, lat){
  /* Dijital pafta: duz kutu. Kagit tarama: koy adlarindan uydurulmus affine (donmeli). */
  if(p.aff){
    const a = p.aff.kx, b = p.aff.ky;         // lon = a0*x + a1*y + a2 ; lat = b0*x + b1*y + b2
    const det = a[0]*b[1] - a[1]*b[0];
    const X = lon - a[2], Y = lat - b[2];
    return [ (X*b[1] - a[1]*Y)/det, (a[0]*Y - b[0]*X)/det ];
  }
  return [ (lon - p.b) * p.w/(p.d-p.b), (p.k - lat) * p.h/(p.k-p.g) ];
}
function jeoPaftaBul(lon, lat){
  const aday = PAFTA.paftalar.filter(x => x.b<=lon && lon<=x.d && x.g<=lat && lat<=x.k);
  const sira = t => t==='kagit' ? 2 : t==='pdf100' ? 1 : 0;   // dijital 1/25k > 1/100k PDF > kagit
  aday.sort((a,b) => sira(a.tur) - sira(b.tur));
  for(const p of aday){
    if(!p.aff) return p;
    const [x,y] = jeoPiksel(p, lon, lat);
    if(x >= 0 && y >= 0 && x <= p.w && y <= p.h) return p;
  }
  return null;
}

function jeoBirimRenk(veri, gen, yuk){
  /* desen cizgilerini eleyip baskin rengi ve koyu desen oranini bulur */
  const d = veri.data; const sayim = new Map(); let koyu = 0, top = 0;
  for(let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], b = d[i+2];
    const enb = Math.max(r,g,b), enk = Math.min(r,g,b);
    top++;
    if((r + g + b) / 3 < 125){ koyu++; continue; }
    if(enb < 90) continue;
    if(enb - enk < 18 && enk > 252) continue;
    const a = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
    sayim.set(a, (sayim.get(a) || 0) + 1);
  }
  let en = 0, kod = -1;
  for(const [a, n] of sayim) if(n > en){ en = n; kod = a; }
  if(kod < 0) return null;
  return { renk: [((kod >> 8) & 15) * 16 + 8, ((kod >> 4) & 15) * 16 + 8, (kod & 15) * 16 + 8],
           desen: top ? koyu / top : 0, guc: en / Math.max(1, top) };
}

function jeoEslestir(olcu, birimler){
  if(!olcu || !birimler || !birimler.length) return [];
  return birimler.map((u, i) => {
    const dr = Math.hypot(olcu.renk[0]-u.renk[0], olcu.renk[1]-u.renk[1], olcu.renk[2]-u.renk[2]);
    return { sira: i + 1, renk: u.renk, renkFark: dr,
             skor: dr + Math.abs(olcu.desen - u.desen) * 220 };
  }).sort((a, b) => a.skor - b.skor);
}

function jeolojiGoster(merkez, halkalar){
  const kutu = $('#jeoloji');
  if(!PAFTA || !PAFTA.paftalar){
    kutu.innerHTML = '<div class="bos">Jeoloji paftaları yüklenemedi.<br>' +
      (YEREL === false
        ? '<b>pafta/index.js</b> bulunamadı — HTML dosyası, yanındaki <b>pafta</b> klasörüyle ' +
          'aynı yerde durmalı. Dosyayı tek başına başka yere kopyaladıysanız çalışmaz.'
        : 'Bir kez <b>python pafta-hazirla.py</b> çalıştırın.') + '</div>';
    return;
  }
  const [lon, lat] = merkez;
  const p = jeoPaftaBul(lon, lat);
  if(!p){
    kutu.innerHTML = '<div class="durum d-uyari"><span class="ikon">?</span><div>' +
      '<b>Bu parselin jeoloji paftası elimizde yok</b><span>Koordinat ' +
      lat.toFixed(5) + ', ' + lon.toFixed(5) + ' — elimizdeki ' + PAFTA.paftalar.length +
      ' MTA paftası Ankara’nın tamamını kapsamıyor (' + kapsananMahalle() + ' mahallede var). ' +
      'Mahalle listesinde <b>◆ ◈ ◇</b> işaretli olanlarda pafta çıkar.<br>' +
      'Bu bölgenin paftasını MTA’dan indirip SCAN HARİTALAR klasörüne koyar, ' +
      'bir kez <b>python pafta-hazirla.py</b> çalıştırırsanız buraya eklenir.</span></div></div>';
    return;
  }
  kutu.innerHTML = '<div class="yukleniyor">' + p.kod + ' paftası yükleniyor…</div>';

  const resim = new Image();
  resim.onload = () => jeoCiz(p, resim, merkez, halkalar);
  resim.onerror = () => { kutu.innerHTML =
    '<div class="hata">' + p.kod + '.jpg okunamadı. pafta/ klasörünü kontrol edin.</div>'; };
  resim.src = 'pafta/' + p.kod + '.jpg';
}

function jeoCiz(p, resim, merkez, halkalar){
  const [lon, lat] = merkez;
  const mLonD = 111320 * Math.cos(lat * Math.PI / 180);      // 1 derece boylam = kac metre
  const mPx   = p.aff
    ? Math.hypot(p.aff.kx[0] * mLonD, p.aff.ky[0] * 111320)   // 1 piksel = kac metre (x yonunde)
    : (p.d - p.b) * mLonD / p.w;
  const pencere = p.tur === 'pdf100' ? 4000 : p.tur === 'kagit' ? 3000 : JEO_PENCERE;   // metre
  const yariPx = Math.round(pencere / 2 / mPx);

  const [cx, cy] = jeoPiksel(p, lon, lat);
  const sx = Math.max(0, Math.min(p.w - 2*yariPx, Math.round(cx - yariPx)));
  const sy = Math.max(0, Math.min(p.h - 2*yariPx, Math.round(cy - yariPx)));
  const kenar = Math.min(2 * yariPx, p.w - sx, p.h - sy);

  /* --- olcum: nokta ve cevresi --- */
  const olcTuval = document.createElement('canvas');
  olcTuval.width = kenar; olcTuval.height = kenar;
  const oc = olcTuval.getContext('2d', { willReadFrequently: true });
  oc.drawImage(resim, sx, sy, kenar, kenar, 0, 0, kenar, kenar);

  let lekeli = false;
  try { oc.getImageData(0, 0, 1, 1); } catch(e){ lekeli = true; }
  const nx = Math.round(cx - sx), ny = Math.round(cy - sy);
  const yari = Math.max(6, Math.round(60 / mPx));             // ~60 m yaricap
  let noktaOlcu = null;
  try{
    noktaOlcu = jeoBirimRenk(oc.getImageData(
      Math.max(0, nx - yari), Math.max(0, ny - yari), yari * 2, yari * 2));
  }catch(e){}
  const sonuc = jeoEslestir(noktaOlcu, p.birim);

  /* --- cevredeki birimler: yaricap icinde orgu ornekleme --- */
  const cevre = new Map(); let ornekSayi = 0;
  if(p.birim && p.birim.length){
    const adimPx = Math.max(3, Math.round(40 / mPx));
    const rPx = JEO_CEVRE / mPx;
    for(let dy = -rPx; dy <= rPx; dy += adimPx)
      for(let dx = -rPx; dx <= rPx; dx += adimPx){
        if(dx*dx + dy*dy > rPx*rPx) continue;
        const x = Math.round(nx + dx), y = Math.round(ny + dy);
        if(x < 3 || y < 3 || x > kenar - 4 || y > kenar - 4) continue;
        let o = null;
        try{ o = jeoBirimRenk(oc.getImageData(x - 3, y - 3, 7, 7)); }catch(e){}
        if(!o) continue;
        const e = jeoEslestir(o, p.birim)[0];
        if(!e || e.renkFark > 60) continue;
        ornekSayi++;
        cevre.set(e.sira, (cevre.get(e.sira) || 0) + 1);
      }
  }
  const cevreSirali = [...cevre.entries()].sort((a, b) => b[1] - a[1]);

  /* --- gosterim tuvali --- */
  const EN = 820, tuval = document.createElement('canvas');
  tuval.id = 'jeoloji-tuval'; tuval.width = EN; tuval.height = EN;
  const c = tuval.getContext('2d');
  c.imageSmoothingQuality = 'high';
  c.drawImage(resim, sx, sy, kenar, kenar, 0, 0, EN, EN);
  const o = EN / kenar;

  /* parsel siniri */
  c.beginPath();
  halkalar[0].forEach((q, i) => {
    const [qx, qy] = jeoPiksel(p, q[0], q[1]);
    const x = (qx - sx) * o, y = (qy - sy) * o;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  });
  c.closePath();
  c.lineWidth = 3; c.strokeStyle = '#c00'; c.stroke();
  c.fillStyle = 'rgba(200,0,0,.18)'; c.fill();

  /* nisan */
  const mx = (cx - sx) * o, my = (cy - sy) * o;
  c.strokeStyle = '#c00'; c.lineWidth = 2.5;
  c.beginPath(); c.arc(mx, my, 26, 0, 7); c.stroke();
  c.beginPath();
  c.moveTo(mx - 40, my); c.lineTo(mx + 40, my);
  c.moveTo(mx, my - 40); c.lineTo(mx, my + 40); c.stroke();

  /* cevre cemberi + olcek */
  c.setLineDash([7, 6]); c.lineWidth = 1.6; c.strokeStyle = '#0b5cad';
  c.beginPath(); c.arc(mx, my, JEO_CEVRE / mPx * o, 0, 7); c.stroke();
  c.setLineDash([]);
  const olcekPx = 500 / mPx * o;
  c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(12, EN - 42, olcekPx + 22, 30);
  c.strokeStyle = '#000'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(22, EN - 20); c.lineTo(22 + olcekPx, EN - 20); c.stroke();
  c.fillStyle = '#000'; c.font = '13px sans-serif'; c.fillText('500 m', 24, EN - 26);

  /* --- metin --- */
  const bs = [];
  bs.push('<div class="jeo-duzen"><div>');
  bs.push('<div id="tuval-yuva"></div>');
  bs.push('<div class="ipucu">Pafta <b>' + p.kod + '</b> · ' +
          (p.tur === 'kagit' ? 'kâğıt tarama (' + kacir(p.kaynak||'') + ')'
           : p.tur === 'pdf100' ? '1/100.000 MTA jeoloji haritası (' + kacir(p.kaynak||'') + ')'
           : '1/25.000 MTA jeoloji haritası') +
          ' · kırmızı: parsel sınırı · mavi kesikli: ' + JEO_CEVRE + ' m çevre · görünen alan ' + (pencere/1000).toFixed(1) + ' km</div>');
  if(p.tur === 'pdf100'){
    bs.push('<div class="durum d-notr" style="margin-top:12px"><span class="ikon">±</span><div>' +
      '<b>1/100.000 pafta — konum hassasiyeti ±' + (p.hata || 70) + ' m</b><span>Bu ölçekte birim ' +
      'sınırları kabaca çizilir; parsel bir sınıra yakınsa iki tarafı da hesaba katın. ' +
      'Formasyonu sağdaki lejanttan okuyun.</span></div></div>');
  }
  if(p.tur === 'kagit'){
    bs.push('<div class="durum d-uyari" style="margin-top:12px"><span class="ikon">±</span><div>' +
      '<b>Yaklaşık konum — hata payı ±' + (p.hata || 500) + ' m</b><span>Bu pafta taranmış kâğıt ' +
      'harita; koordinat çerçevesi olmadığından köy adlarından kalibre edildi. İşaret bir birim ' +
      'sınırına yakınsa iki tarafı da hesaba katın. Formasyonu sağdaki lejanttan okuyun.</span></div></div>');
  }
  if(lekeli){
    bs.push('<div class="durum d-notr" style="margin-top:12px"><span class="ikon">◆</span><div>' +
      '<b>Formasyonu paftadan okuyun</b><span>Sayfa dosyadan açıldığı için tarayıcı piksel ' +
      'okumasına izin vermiyor; otomatik renk eşleştirmesi yapılamadı. Kırmızı işaretin üstündeki ' +
      'birimi sağdaki lejanttan bulun. Otomatik eşleşme için <b>ADA PARSEL</b> kısayoluyla açın.' +
      '</span></div></div>');
  }
  if(sonuc.length){
    const en = sonuc[0];
    const ayni = sonuc.filter((x, i) => i > 0 && x.renkFark < 45);
    bs.push('<div class="durum ' + (ayni.length ? 'd-uyari' : 'd-notr') + '" style="margin-top:12px">' +
      '<span class="ikon">◆</span><div><b>Nokta, lejanttaki ' + en.sira + '. birime düşüyor</b><span>' +
      (ayni.length
        ? 'Ama ' + ayni.map(x => x.sira + '. birim').join(', ') + ' aynı renkte — ' +
          'desen farkına göre ' + en.sira + '. sırayı seçtim, kesin değil. Lejanttan gözünle doğrula.'
        : 'Bu renk lejantta tek birime ait, eşleşme net.') +
      '</span></div></div>');
  }
  if(cevreSirali.length > 1){
    bs.push('<h3 style="font-size:13px;margin:14px 0 6px;color:var(--soluk);' +
            'text-transform:uppercase;letter-spacing:.05em">' + JEO_CEVRE +
            ' m çevredeki birimler</h3>' +
            '<div class="ipucu" style="margin:0 0 6px">Sondaj derinleştikçe bu birimlere girilebilir.</div>' +
            '<table class="birimler"><tbody>');
    for(const [sira, n] of cevreSirali.slice(0, 6)){
      const u = p.birim[sira - 1];
      bs.push('<tr><td class="yama"><i style="background:rgb(' + u.renk.join(',') + ')"></i></td>' +
        '<td><span class="sira">' + sira + '</span> lejanttaki ' + sira + '. birim</td>' +
        '<td class="s" style="text-align:right">%' +
        (n / ornekSayi * 100).toFixed(0) + '</td></tr>');
    }
    bs.push('</tbody></table>');
  }
  bs.push('</div>');
  bs.push('<div class="lejant-kutu"><div class="bas">' + p.kod + ' — Açıklamalar</div>' +
    (p.lejant ? [].concat(p.lejant).map(l => '<img src="pafta/' + l + '" alt="lejant">').join('')
              : '<div class="bos">lejant çıkarılamadı</div>') + '</div>');
  bs.push('</div>');

  $('#jeoloji').innerHTML = bs.join('');
  document.getElementById('tuval-yuva').appendChild(tuval);
}

$('#sorgula').onclick = sorgula;
$('#yazdir').onclick = () => window.print();
document.querySelectorAll('#ada,#parsel').forEach(e =>
  e.addEventListener('keydown', ev => { if(ev.key === 'Enter') sorgula(); }));
</script>
</body>
</html>
